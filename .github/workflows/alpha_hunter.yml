name: Pristine Alpha Hunter

on:
  # 8:00 AM CST = 14:00 UTC (CST is UTC-6)
  # During CDT (summer, UTC-5) this fires at 9:00 AM — adjust to 13:00 if preferred
  schedule:
    - cron: "0 14 * * 1-5"
  # Manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      min_premium:
        description: "Minimum sweep premium in dollars"
        required: false
        default: "500000"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore accumulated database from previous runs
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: alpha_sweeps.db
          key: alpha-db-${{ github.run_id }}
          restore-keys: |
            alpha-db-

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UW_API_TOKEN: ${{ secrets.UW_API_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          MIN="${{ github.event.inputs.min_premium || '500000' }}"
          python alpha_hunter.py --min-premium "$MIN" --db alpha_sweeps.db

      # Load FLAG_COUNT, SWEEP_COUNT, SCAN_DATE into env for the subject line
      - name: Load scan metadata
        run: cat scan_meta.env >> "$GITHUB_ENV"

      - name: Send email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Pristine Alpha — ${{ env.SCAN_DATE }} — ${{ env.FLAG_COUNT }} flag(s) / ${{ env.SWEEP_COUNT }} sweeps"
          to: ${{ secrets.EMAIL_TO }}
          from: "Alpha Hunter <${{ secrets.SMTP_USER }}>"
          html_body: file://email_summary.html

      # Also upload DB so you can download and query it from the Actions tab
      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-sweeps-${{ github.run_number }}
          path: |
            alpha_sweeps.db
            email_summary.html
          retention-days: 30
