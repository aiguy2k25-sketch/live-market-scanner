name: Pristine Alpha Hunter

on:
  # Run at market open and mid-day on US trading days (Mon–Fri)
  # Times in UTC: 14:30 = 9:30 ET open, 17:00 = 12:00 ET midday
  schedule:
    - cron: "30 14 * * 1-5"   # 9:30 AM ET — market open sweep
    - cron: "0 17 * * 1-5"    # 12:00 PM ET — midday sweep
    - cron: "55 20 * * 1-5"   # 3:55 PM ET — end-of-day sweep
  # Also allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      min_premium:
        description: "Minimum sweep premium in dollars"
        required: false
        default: "500000"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the database from the previous run so history accumulates
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: alpha_sweeps.db
          key: alpha-db-${{ github.run_id }}
          restore-keys: |
            alpha-db-

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UW_API_TOKEN: ${{ secrets.UW_API_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          MIN_PREMIUM="${{ github.event.inputs.min_premium || '500000' }}"
          python alpha_hunter.py --min-premium "$MIN_PREMIUM" --db alpha_sweeps.db

      # Upload the DB as an artifact so you can download and inspect it
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-sweeps-${{ github.run_number }}
          path: alpha_sweeps.db
          retention-days: 30
