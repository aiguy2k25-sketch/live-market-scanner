name: Daily Scanner

on:
  schedule:
    # DST-PROOF (see gate step). Mornings belong to the Pre-Market scanner;
    # this workflow owns ONLY the 3:18 PM CT post-close send. Both seasonal
    # UTC slots are listed; the gate runs whichever matches the season.
    #                          CDT(UTC-5) / CST(UTC-6)
    - cron: '18 20 * * 1-5'   # 15:18 CT -> summer
    - cron: '18 21 * * 1-5'   # 15:18 CT -> winter
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: DST gate (run only the in-season slot)
        id: gate
        run: |
          set -euo pipefail
          SCHED="${{ github.event.schedule }}"
          OFFSET="$(TZ=America/Chicago date +%z)"
          echo "Chicago offset: $OFFSET | cron: '${SCHED:-<manual>}'"
          if [ -z "$SCHED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          MH="$(printf '%s' "$SCHED" | awk '{print $1, $2}')"
          CDT_SLOTS=";18 20;"
          CST_SLOTS=";18 21;"
          if [ "$OFFSET" = "-0500" ]; then WANT="$CDT_SLOTS"; else WANT="$CST_SLOTS"; fi
          case "$WANT" in
            *";$MH;"*) echo "In-season -> running.";  echo "run=true"  >> "$GITHUB_OUTPUT" ;;
            *)         echo "Off-season -> skipping."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check out repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        if: steps.gate.outputs.run == 'true'
        run: python run_scanner.py --out results

      - name: Send email
        if: steps.gate.outputs.run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_email.py

      - name: Upload results as artifact
        if: steps.gate.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: results/
          retention-days: 30
