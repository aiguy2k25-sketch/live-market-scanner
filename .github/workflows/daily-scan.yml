name: Daily Scanner

on:
  schedule:
    # GitHub Actions delays scheduled runs 30-80 min, worst at :00/:30 slots
    # (2026-07-14: the 13:00 UTC premarket run started ~78 min late). Both
    # crons below are scheduled early at off-peak minutes to absorb the delay.
    # 12:12 UTC = 7:12 AM CDT nominal -> email lands before the 8:30 open
    - cron: '12 12 * * 1-5'
    # 20:18 UTC = 3:18 PM CDT nominal -> post-close email arrives ~3:45-4:30
    - cron: '18 20 * * 1-5'
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        run: python run_scanner.py --out results

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_email.py

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: results/
          retention-days: 30
