name: Pre-Market Catalyst Scanner

on:
  schedule:
    # James is in CT, not ET. '0 12' UTC = 7:00 AM CDT, an hour EARLIER than the
    # intended 8:00 AM CT -- and the report then printed the raw UTC clock with a
    # hard-coded "CT" label, so it claimed "12:00 PM CT" while actually running
    # pre-market. Bot now converts properly; cron below is true 8:00 AM CT (CDT).
    #   13:00 UTC = 8:00 AM CDT (Mar-Nov)  |  14:00 UTC = 8:00 AM CST (Nov-Mar)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  premarket-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 lxml tabulate colorama tzdata

      - name: Run pre-market scanner
        timeout-minutes: 12
        env:
          EMAIL_TO:  2daysale@gmail.com
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: 2daysale@gmail.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          cd premarket
          python premarket_bot.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-scan-${{ github.run_number }}
          path: premarket/scan_*.txt
          retention-days: 30
