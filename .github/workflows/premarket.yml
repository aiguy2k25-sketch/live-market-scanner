name: Pre-Market Catalyst Scanner

on:
  schedule:
    # 8:00 AM ET = 12:00 UTC during daylight saving (Mar-Nov)
    # If you want this exact at 8 AM ET year-round, switch to 13:00 UTC in winter
    - cron: '0 12 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  premarket-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4 lxml tabulate colorama

      - name: Run pre-market scanner
        timeout-minutes: 12
        env:
          EMAIL_TO:  2daysale@gmail.com
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: 2daysale@gmail.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          cd premarket
          python premarket_bot.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-scan-${{ github.run_number }}
          path: premarket/scan_*.txt
          retention-days: 30
