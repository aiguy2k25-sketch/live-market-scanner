name: Optimal Strategy Scanner

on:
  schedule:
    # Every 15 minutes, Mon-Fri, 9:30 AM – 12:30 PM ET (morning session only)
    # EDT (Mar-Nov, UTC-4): 13:30-16:30 UTC
    # EST (Nov-Mar, UTC-5): 14:30-17:30 UTC
    # Both ranges scheduled — Python script checks ET time and exits if outside window
    - cron: '30 13 * * 1-5'
    - cron: '45 13 * * 1-5'
    - cron: '0  14 * * 1-5'
    - cron: '15 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '45 14 * * 1-5'
    - cron: '0  15 * * 1-5'
    - cron: '15 15 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '0  16 * * 1-5'
    - cron: '15 16 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '0  17 * * 1-5'
    - cron: '15 17 * * 1-5'
    - cron: '30 17 * * 1-5'
  workflow_dispatch:

jobs:
  optimal-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy pytz

      - name: Run Optimal Strategy scanner
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
        run: python optimal_scanner.py

      - name: Upload scan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimal-scan-${{ github.run_number }}
          path: optimal_scan.json
          retention-days: 7
