name: Optimal Strategy Scanner

on:
  # Triggered by Cloudflare Worker (trading-scheduler) — more reliable than GitHub cron
  workflow_dispatch:

jobs:
  optimal-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy pytz

      - name: Run Optimal Strategy scanner
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
        run: python optimal_scanner.py

      - name: Upload scan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimal-scan-${{ github.run_number }}
          path: optimal_scan.json
          retention-days: 7
